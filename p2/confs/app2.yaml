# =============================================================================
# app2 — application accessible via le host "app2.com"
#
# Structure IDENTIQUE a app1.yaml (ConfigMap + Deployment + Service).
# UNE SEULE difference de fond : "replicas: 3" (exige par le sujet).
# =============================================================================

# -----------------------------------------------------------------------------
# 1. ConfigMap : la page HTML
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
      <head>
        <meta charset="utf-8">
        <title>app2</title>
      </head>
      <body style="background:#43a047; color:#fff; font-family:sans-serif;
                   display:flex; align-items:center; justify-content:center;
                   height:100vh; margin:0;">
        <h1 style="font-size:4rem;">Hello from app2</h1>
      </body>
    </html>

---
# -----------------------------------------------------------------------------
# 2. Deployment : 3 Pods nginx identiques
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  # >>> LA LIGNE DEMANDEE PAR LE SUJET <<<
  # Le Deployment maintient en permanence 3 Pods construits sur le meme
  # template. On n'ecrit pas trois fois le Pod : on declare la quantite voulue
  # et le controleur s'en charge (recreation automatique si l'un meurt).
  replicas: 3

  selector:
    matchLabels:
      app: app2

  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: app2-html

---
# -----------------------------------------------------------------------------
# 3. Service : une seule adresse stable devant les 3 Pods
# -----------------------------------------------------------------------------
# Rien a changer par rapport a app1 : le Service selectionne par label, donc il
# trouve 1 Pod ou 100 Pods sans que sa definition bouge. Il repartit le trafic
# entre tous les Pods "Ready" qui portent le label app=app2.
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  type: ClusterIP
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
