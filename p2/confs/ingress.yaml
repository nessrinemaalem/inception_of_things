# Routage par nom d'hote. C'est Traefik, l'Ingress Controller livre avec K3s,
# qui lit cet objet et route reellement le trafic ; l'Ingress seul ne fait rien.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
spec:
  ingressClassName: traefik

  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80

    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80

    # Regle par defaut : c'est l'ABSENCE de "host" qui la definit, elle matche
    # donc n'importe quel nom d'hote. Les deux regles ci-dessus restent
    # prioritaires car Traefik privilegie la route la plus specifique :
    # l'ordre d'ecriture dans ce fichier n'a aucune importance.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80
